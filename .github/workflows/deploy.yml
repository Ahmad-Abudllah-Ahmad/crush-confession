name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # or master, depending on your default branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create static build
        run: |
          next build
          touch out/.nojekyll
        env:
          # Add environment variables needed for build
          NEXTAUTH_URL: https://Ahmad-Abudllah-Ahmad.github.io/crush-confession
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'temporary-secret-for-build' }}
          # Skip database operations during build
          SKIP_DB_OPERATIONS: true
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true